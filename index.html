<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<link rel="stylesheet" href="style.css">
<style>
  #status { position: fixed; left: 12px; bottom: 12px; z-index: 1; margin: 0; padding: 6px 10px;
            border-radius: 6px; background: rgba(0,0,0,.75); color: #ddd;
            font: 13px/1.4 system-ui, sans-serif; pointer-events: none; }
  #status[hidden], .lb-open #status { display: none; }
</style>
</head>
<body>

<main id="gallery" class="gallery"></main>
<p id="status" role="status">Loading photos…</p>

<div id="lb" class="lb" hidden>
  <img id="lb-img" alt="">
  <button id="lb-prev" class="lb-btn" aria-label="Previous">&#8249;</button>
  <button id="lb-next" class="lb-btn" aria-label="Next">&#8250;</button>
  <button id="lb-close" class="lb-btn" aria-label="Close">&times;</button>
</div>

<script>
(async () => {
  /* ---- settings ---- */
  const FOLDER = 'photos/';
  const LIST_FILE = 'list.txt';       // optional photos/list.txt containing the file names: whole gallery in one request
  const EXTS = ['jpg'];               // extensions tried for each date when probing
  const FIRST = Date.UTC(2000, 0, 1); // no photos before 2000-01-01
  const EAGER = 8;                    // first photos loaded at high priority, the rest when scrolled near

  const DAY = 864e5;
  // a file name like 2026-01-31.jpg anywhere in a text (list.txt, folder listing)
  const NAME_RE = /(?<![\w-])(\d{4})-(\d{2})-(\d{2})\.(jpe?g|png|webp|gif)(?![\w.])/gi;
  const isName = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}\.(jpe?g|png|webp|gif)$/i.test(s) && s >= '2000';
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---- elements & state ---- */
  const gallery = document.getElementById('gallery');
  const status = document.getElementById('status');
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lb-img');
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  const photos = [];       // file names, newest first
  const items = new Map(); // file name -> <a>
  let ratios = {};         // file name -> width/height, remembered between visits
  let curName = null;

  const say = text => { status.textContent = text; status.hidden = !text; };
  const arrows = () => { prev.hidden = next.hidden = photos.length < 2; };

  /* ---- remember the list between visits (instant repeat visits) ---- */
  const KEY = 'gallery:' + new URL(FOLDER, location.href).href;
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem(KEY));
      ratios = (c && typeof c.r === 'object' && c.r) || {};
      return Array.isArray(c && c.list) ? c.list.filter(isName) : [];
    } catch (_) { return []; }
  }
  let saveTimer = null;
  function flushCache() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try {
      const r = {};
      for (const n of photos) if (ratios[n]) r[n] = ratios[n];
      localStorage.setItem(KEY, JSON.stringify({ list: photos, r }));
    } catch (_) {}
  }
  const saveCache = () => { if (saveTimer === null) saveTimer = setTimeout(flushCache, 500); };
  addEventListener('pagehide', () => { if (saveTimer !== null) flushCache(); });

  /* ---- gallery: keep photos sorted newest first while they arrive ---- */
  function insert(name) {
    if (items.has(name)) return;
    let lo = 0, hi = photos.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (photos[m] > name) lo = m + 1; else hi = m; }
    photos.splice(lo, 0, name);

    const a = document.createElement('a');
    const src = FOLDER + name;
    a.href = src;
    if (ratios[name]) a.style.setProperty('--r', ratios[name]);
    const img = new Image();
    img.alt = name.slice(0, 10);
    img.decoding = 'async';
    if (lo < EAGER) img.fetchPriority = 'high'; else img.loading = 'lazy';
    img.onload = () => {
      const r = +(img.naturalWidth / img.naturalHeight).toFixed(4);
      a.style.setProperty('--r', r);
      if (ratios[name] !== r) { ratios[name] = r; saveCache(); }
    };
    let retry = 0;
    img.onerror = async () => { // deleted since last visit, or the server was busy?
      const ok = await exists(src);
      if (ok === false) remove(name);
      else if (retry < 3) setTimeout(() => { img.src = src + '?retry=' + ++retry; }, 1500 * (retry + 1));
    };
    img.src = src;
    a.append(img);
    a.addEventListener('click', e => { e.preventDefault(); show(photos.indexOf(name)); });

    gallery.insertBefore(a, items.get(photos[lo + 1]) || null);
    items.set(name, a);
    arrows();
  }

  function remove(name) {
    const i = photos.indexOf(name);
    if (i < 0) return;
    photos.splice(i, 1);
    items.get(name).remove();
    items.delete(name);
    arrows();
    saveCache();
  }

  function setAll(list) {
    const keep = new Set(list);
    for (const n of [...photos]) if (!keep.has(n)) remove(n);
    [...keep].sort().reverse().forEach(insert);
  }

  /* ---- full-screen viewer ---- */
  function show(i) {
    if (!photos.length) return;
    i = (i + photos.length) % photos.length;
    curName = photos[i];
    lbImg.src = FOLDER + curName;
    lbImg.alt = curName.slice(0, 10);
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
    document.body.classList.add('lb-open');
    // preload the neighbours so arrows feel instant
    new Image().src = FOLDER + photos[(i + 1) % photos.length];
    new Image().src = FOLDER + photos[(i - 1 + photos.length) % photos.length];
  }
  const step = d => show(photos.indexOf(curName) + d);

  function close() {
    lb.hidden = true;
    lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    document.body.classList.remove('lb-open');
  }

  prev.addEventListener('click', () => step(-1));
  next.addEventListener('click', () => step(1));
  document.getElementById('lb-close').addEventListener('click', close);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });

  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Escape') close();
  });

  // swipe left/right on phones
  let x0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });

  /* ---- fast sources: photos/list.txt, then the server's folder listing (one request each) ---- */
  async function namesIn(url) {
    try {
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) return null;
      const found = new Set();
      for (const m of (await r.text()).matchAll(NAME_RE)) if (+m[1] >= 2000) found.add(m[0]);
      return found.size ? [...found] : null;
    } catch (_) { return null; }
  }

  /* ---- slow fallback: try every date from tomorrow back to 2000-01-01 ---- */
  const fromDisk = location.protocol === 'file:';
  let method = 'HEAD', pauseUntil = 0;
  // HTTP/2 and 3 carry many requests at once; HTTP/1.1 browsers open ~6 connections, so more is pointless
  const parallel = () => fromDisk ? 32 :
    ['navigation', 'resource'].flatMap(t => performance.getEntriesByType(t))
      .some(e => /^h[23]/.test(e.nextHopProtocol || '')) ? 48 : 8;

  // true = exists, false = missing, null = could not tell
  async function exists(url) {
    if (fromDisk) { // pages opened from disk cannot use fetch; image loading still works
      return new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; });
    }
    for (let tries = 0; tries < 6; tries++) {
      const wait = pauseUntil - Date.now();
      if (wait > 0) await sleep(wait);
      const m = method, r = await fetch(url, m === 'HEAD'
        ? { method: 'HEAD', cache: 'no-store' }
        : { cache: 'no-store', headers: { Range: 'bytes=0-0' } }).catch(() => null);
      if (!r) { await sleep(300 * 2 ** tries); continue; } // network hiccup: retry
      if (m === 'GET') r.body && r.body.cancel().catch(() => {});
      if ((r.status === 405 || r.status === 501) && m === 'HEAD') { method = 'GET'; tries--; continue; } // server refuses HEAD
      if (r.status === 429 || r.status === 503) { // server asks to slow down: pause every request
        const after = parseFloat(r.headers.get('Retry-After'));
        pauseUntil = Math.max(pauseUntil, Date.now() + (after > 0 ? after * 1000 : 500 * 2 ** tries));
        continue;
      }
      if (r.ok) return !/text\/html/i.test(r.headers.get('Content-Type') || '');
      if (r.status < 500) return false;
      await sleep(300 * 2 ** tries);
    }
    return null;
  }

  async function probe(verbose) {
    const t = new Date();
    const dates = [];
    for (let d = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) + DAY; d >= FIRST; d -= DAY)
      dates.push(new Date(d).toISOString().slice(0, 10));

    const found = new Set(), missing = new Set();
    let n = 0, failed = 0;
    const worker = async () => {
      while (n < dates.length) {
        const date = dates[n++];
        let unsure = false, hit = null;
        for (const ext of EXTS) {
          const ok = await exists(FOLDER + date + '.' + ext);
          if (ok) { hit = date + '.' + ext; break; }
          if (ok === null) unsure = true;
        }
        if (hit) { found.add(hit); insert(hit); saveCache(); }
        else if (unsure) failed++;
        else missing.add(date);
        if (verbose && n % 20 === 0)
          say(`Searching for photos… ${date.slice(0, 4)} · ${photos.length} found`);
      }
    };
    await Promise.all(Array.from({ length: parallel() }, worker));

    // drop remembered photos whose date is now confirmed missing
    for (const name of [...photos]) if (!found.has(name) && missing.has(name.slice(0, 10))) remove(name);
    return failed;
  }

  /* ---- run ---- */
  const cached = loadCache();
  if (cached.length) { setAll(cached); say(''); }

  const list = await namesIn(FOLDER + LIST_FILE) || await namesIn(FOLDER);
  if (list) {
    setAll(list);
    flushCache();
    say('');
    return;
  }

  const verbose = !cached.length; // repeat visits refresh silently in the background
  if (verbose) say('Searching for photos…');
  const failed = await probe(verbose);
  flushCache();
  if (!photos.length)
    say(failed ? `No photos found; ${failed} dates could not be checked (server unreachable or busy).`
               : 'No photos found in photos/ (expected names like 2026-01-31.jpg).');
  else if (failed && verbose) say(`${failed} dates could not be checked; reload to retry.`);
  else say('');
})();
</script>
</body>
</html>
